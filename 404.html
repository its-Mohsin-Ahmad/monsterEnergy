<!DOCTYPE html>
<html>
<head>
  <title>Monster Energy Admin</title>
  <script>
    // SPA routing fix for GitHub Pages
    // Redirect all 404s to index.html so React Router can handle the route
    var path = window.location.pathname;
    var newPath = path;
    
    // If the path doesn't start with /monsterEnergy/, redirect to index
    if (!path.startsWith('/monsterEnergy/')) {
      newPath = '/monsterEnergy' + path;
    }
    
    // Always serve index.html for client-side routing
    window.location.replace('/monsterEnergy/index.html' + (window.location.search ? window.location.search : ''));
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
</body>
</html>
